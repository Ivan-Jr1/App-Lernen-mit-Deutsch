# Blueprint do Render (https://render.com/docs/blueprint-spec).
# Import via "New +" -> "Blueprint" apontando para este repositório.
services:
  - type: web
    name: deutsch-app-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Definido manualmente no painel do Render (string do Neon/Postgres).
      # sync:false = o blueprint não sobrescreve o que estiver lá.
      - key: DATABASE_URL
        sync: false
      - key: SEED_ON_STARTUP
        value: "true"
      # Libera qualquer subdomínio *.vercel.app (a Vercel gera uma URL por deploy).
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      # Chave JWT: o Render gera um valor aleatório no primeiro deploy.
      - key: JWT_SECRET
        generateValue: true
